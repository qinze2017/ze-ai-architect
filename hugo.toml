baseURL = "https://ai.zeaitech.com/"

title = "Ze Qin · AI 软件架构与开发"
enableRobotsTXT = true
enableGitInfo = false
summaryLength = 32

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 8
  path = "page"

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-CN"
    weight = 1
    title = "Ze Qin — AI 产品工程师"

    [languages.zh.params]
      description = "个人简历、AI 软件架构实践、项目复盘与持续学习记录。"

  [languages.fr]
    label = "Français"
    locale = "fr-CA"
    weight = 2
    title = "Ze Qin — Ingénieur produit IA"

    [languages.fr.params]
      description = "Portfolio, architecture logicielle IA, projets et apprentissage continu."

  [languages.en]
    label = "English"
    locale = "en-CA"
    weight = 3
    title = "Ze Qin — AI Product Engineer"

    [languages.en.params]
      description = "Portfolio, AI software architecture, project reviews, and continuous learning."

[params]
  description = "个人简历、AI 软件架构实践、项目复盘与持续学习记录。"
  author = "Ze Qin"
  location = "Sherbrooke, Québec, Canada"
  github = "https://github.com/qinze2017"
  linkedin = ""
  email = ""
  defaultTheme = "system"
  showReadingTime = true
  showLastModified = true

  [params.giscus]
    enabled = true
    repo = "qinze2017/ze-ai-architect"
    repoId = "R_kgDOTh5MpA"
    category = "Announcements"
    categoryId = "DIC_kwDOTh5MpM4DB2RV"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    theme = "preferred_color_scheme"
    loading = "lazy"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  posts = "/posts/:slugorcontentbasename/"
  learning = "/learning/:slugorcontentbasename/"
  progress = "/progress/:slugorcontentbasename/"
  projects = "/projects/:slugorcontentbasename/"

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

