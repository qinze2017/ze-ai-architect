{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.Params.author | jsonify }},
  "url": {{ site.BaseURL | jsonify }},
  "jobTitle": "AI Software Architect and Full-Stack Developer",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Sherbrooke",
    "addressRegion": "Québec",
    "addressCountry": "CA"
  },
  "sameAs": [{{ site.Params.github | jsonify }}]
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ (.Description | default .Summary | plainify) | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "author": {"@type": "Person", "name": {{ site.Params.author | jsonify }}}
}
</script>
{{ end }}
