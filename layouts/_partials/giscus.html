{{ $g := site.Params.giscus }}
{{ $language := site.Language.Lang }}
{{ if eq $language "zh" }}{{ $language = "zh-CN" }}{{ end }}
{{ if and $g.enabled .IsPage .Params.showComments }}
<section class="comments" aria-label="{{ i18n "commentsTitle" }}">
  <h2>{{ i18n "commentsTitle" }}</h2>
  <p class="muted">{{ i18n "commentsDescription" }}</p>
  <script src="https://giscus.app/client.js"
          data-repo="{{ $g.repo }}"
          data-repo-id="{{ $g.repoId }}"
          data-category="{{ $g.category }}"
          data-category-id="{{ $g.categoryId }}"
          data-mapping="{{ $g.mapping }}"
          data-strict="{{ $g.strict }}"
          data-reactions-enabled="{{ $g.reactionsEnabled }}"
          data-emit-metadata="{{ $g.emitMetadata }}"
          data-input-position="{{ $g.inputPosition }}"
          data-theme="{{ $g.theme }}"
          data-lang="{{ $language }}"
          data-loading="{{ $g.loading }}"
          crossorigin="anonymous"
          async>
  </script>
</section>
{{ end }}
