<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="返回首页">
      <span class="brand-mark"><span>Z</span><span>Q</span></span>
      <span class="brand-copy"><strong>{{ site.Params.author }}</strong><small>AI PRODUCT ENGINEER</small></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav class="main-nav" aria-label="主导航">
      <div class="nav-links">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </div>
      <button class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </nav>
  </div>
</header>
