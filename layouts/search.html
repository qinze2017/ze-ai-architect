{{ define "main" }}
<section class="page-hero container reveal">
  <p class="eyebrow">{{ i18n "search" }}</p>
  <h1>{{ .Title }}</h1>
  <p class="page-intro">{{ i18n "searchIntro" }}</p>
</section>
<section class="section container search-shell" data-search-page data-search-index="{{ (site.Home.OutputFormats.Get "SearchIndex").RelPermalink }}" data-search-error="{{ i18n "searchError" }}" data-search-minimum="{{ i18n "searchMinimum" }}" data-search-results="{{ i18n "searchResults" }}" data-search-empty="{{ i18n "searchEmpty" }}">
  <label for="site-search">{{ i18n "searchContent" }}</label>
  <input id="site-search" class="search-input" type="search" placeholder="{{ i18n "searchPlaceholder" }}" autocomplete="off">
  <p class="search-status" aria-live="polite">{{ i18n "searchStart" }}</p>
  <div class="search-results card-grid"></div>
</section>
{{ end }}
